name: Release Obsidian theme

on:
  push:
    tags:
      - '*'

# gh release create needs write access to contents, spelled out rather than
# left to the repository default, which may be read-only. attest-build-provenance
# needs id-token (to mint the signing identity) and attestations (to publish it).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Obsidian resolves a theme release by looking for a tag that matches
      # manifest.json's version, so a mismatch would publish a release the
      # app can never install.
      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p 'require("./manifest.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'theme.css, manifest.json'

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            manifest.json theme.css
